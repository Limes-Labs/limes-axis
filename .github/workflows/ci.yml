name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint schemas
        run: pnpm --filter @limes-axis/schemas lint

      - name: Test schemas
        run: pnpm --filter @limes-axis/schemas test

      - name: Lint
        run: pnpm --filter @limes-axis/web lint

      - name: Typecheck
        run: pnpm --filter @limes-axis/web typecheck

      - name: Test
        run: pnpm --filter @limes-axis/web test

      - name: Build
        run: pnpm --filter @limes-axis/web build

      - name: Install Playwright browsers
        run: pnpm --filter @limes-axis/web exec playwright install --with-deps chromium

      - name: Smoke test
        run: pnpm --filter @limes-axis/web test:e2e

  # The `web` job stubs the API at an unreachable port, so it only ever exercises
  # failure states — every spec guarded by AXIS_E2E_LIVE_API (the live overview and
  # the three story specs) skipped silently in CI. This job runs the console against
  # a real API on a real Postgres so those paths are actually covered.
  integration:
    name: Integration (live API)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: axis
          POSTGRES_PASSWORD: axis
          POSTGRES_DB: axis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U axis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      AXIS_ENV: development
      AXIS_POSTGRES_DSN: postgresql+psycopg://axis:axis@localhost:5432/axis
      AXIS_OIDC_AUTH_REQUIRED: "false"
      AXIS_API_RATE_LIMIT_ENABLED: "false"
      AXIS_WORKFLOW_SIGNALS_ENABLED: "false"
      AXIS_API_BASE_URL: http://127.0.0.1:8000
      AXIS_PUBLIC_BASE_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_AXIS_API_BASE_URL: http://127.0.0.1:8000
      AXIS_E2E_LIVE_API: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Install API dependencies
        working-directory: services/api
        run: uv sync --locked

      # Migrations are Postgres-only (JSONB columns), which is why this job cannot
      # fall back to SQLite the way local development can.
      - name: Migrate database
        working-directory: services/api
        run: uv run alembic upgrade head

      - name: Start API
        working-directory: services/api
        run: |
          uv run uvicorn axis_api.main:create_app --factory \
            --host 127.0.0.1 --port 8000 > "${RUNNER_TEMP}/api.log" 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/health > /dev/null 2>&1; then
              echo "API ready"; exit 0
            fi
            sleep 1
          done
          echo "API failed to become ready"; cat "${RUNNER_TEMP}/api.log"; exit 1

      - name: Seed demo scenario
        run: |
          curl -fsS -X POST \
            "http://127.0.0.1:8000/demo/manufacturing/bootstrap?tenant_id=tenant_demo_manufacturing" \
            -H "content-type: application/json" -d '{}' > /dev/null

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @limes-axis/web exec playwright install --with-deps chromium

      - name: Live overview and story specs
        run: |
          pnpm --filter @limes-axis/web test:e2e:live
          pnpm --filter @limes-axis/web test:e2e:stories

      - name: API log on failure
        if: failure()
        run: cat "${RUNNER_TEMP}/api.log" || true

  python:
    name: Python
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Install API dependencies
        working-directory: services/api
        run: uv sync --locked

      - name: Lint API
        working-directory: services/api
        run: uv run ruff check .

      - name: Test API
        working-directory: services/api
        run: uv run pytest

      - name: Check OpenAPI schema
        run: make openapi-check

      - name: Check deployment package
        run: make deployment-check

      - name: Check Helm deployment profile renders
        run: make deployment-profile-render-check

      - name: Check container image package
        run: make container-check

      - name: Check container release package
        run: make container-release-check

      - name: Check container security scan package
        run: make container-security-check

      - name: Check vulnerability management package
        run: make vulnerability-management-check

      - name: Install worker dependencies
        working-directory: services/worker
        run: uv sync --locked

      - name: Lint worker
        working-directory: services/worker
        run: uv run ruff check .

      - name: Test worker
        working-directory: services/worker
        run: uv run pytest

      - name: Install SDK dependencies
        working-directory: packages/sdk-python
        run: uv sync --locked

      - name: Lint SDK
        working-directory: packages/sdk-python
        run: uv run ruff check .

      - name: Test SDK
        working-directory: packages/sdk-python
        run: uv run pytest
