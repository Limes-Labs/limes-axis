# Limes Axis local-only profile.
#
# Use with:
#   helm upgrade --install limes-axis infra/helm/limes-axis \
#     --namespace limes-axis --create-namespace \
#     -f infra/helm/limes-axis/profiles/local-only.yaml
#
# This is the opt-in strict egress profile (#870, parent #473). It renders
# egressMode: local_only, so the Axis workloads may reach only the local service
# destinations declared below plus the scoped local resolvers. It never renders
# an unrestricted DNS rule, a port-only egress rule or an all-address CIDR.
#
# `podSelector`-only destinations resolve to the release namespace. Services in
# another namespace must declare `namespace:` explicitly, and off-cluster
# services must declare a bounded `ipBlock`. Rendering this NetworkPolicy is not
# proof of isolation: read docs/zero-egress-local-only-profile.md for the CNI,
# additive-policy, node-local DNS and upstream-resolver prerequisites that a
# live rehearsal (#872) must observe separately.

secrets:
  externalSecret:
    enabled: true

api:
  replicaCount: 3
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 6
    targetCPUUtilizationPercentage: 65
    targetMemoryUtilizationPercentage: 75
  pdb:
    enabled: true
    minAvailable: 2
  podAnnotations:
    limes-axis.io/profile: local-only
  env:
    AXIS_ENV: production
    AXIS_TENANT_ADMISSION_MODE: registered_only
    AXIS_DEPLOYMENT_TENANCY_MODE: on_prem
    AXIS_DEPLOYMENT_CUSTOMER_ISOLATION_CONFIGURED: "false"
    AXIS_DEPLOYMENT_DATA_RESIDENCY_CONFIGURED: "false"
    AXIS_DEPLOYMENT_OPERATOR_ACCESS_RUNBOOK_CONFIGURED: "false"
    AXIS_DEPLOYMENT_BREAK_GLASS_APPROVAL_CONFIGURED: "false"
    AXIS_OIDC_AUTH_REQUIRED: "true"
    AXIS_OIDC_SESSION_COOKIE_SECURE: "true"
    AXIS_API_RATE_LIMIT_ENABLED: "true"
    AXIS_EXTERNAL_MODEL_EGRESS_ENABLED: "false"
    AXIS_CONNECTOR_SYNC_EXECUTION_ENABLED: "false"
    AXIS_EXTERNAL_DB_SYNC_EXECUTION_ENABLED: "false"
    AXIS_EXTERNAL_DB_LIVE_QUERY_PREFLIGHT_ENABLED: "false"
    AXIS_EXTERNAL_DB_LIVE_QUERY_EXECUTION_ENABLED: "false"
    AXIS_EXTERNAL_DB_LIVE_QUERY_PROFILE_ID: profile_postgres_ops_readonly
    AXIS_EXTERNAL_DB_LIVE_QUERY_SCHEMA: operations
    AXIS_EXTERNAL_DB_LIVE_QUERY_TABLE: production_orders
    AXIS_EXTERNAL_DB_LIVE_QUERY_COLUMNS:
      - order_id
      - asset_id
      - work_center
      - status
      - risk_level
    AXIS_EXTERNAL_DB_LIVE_QUERY_ROW_LIMIT: "100"
    AXIS_EXTERNAL_DB_LIVE_QUERY_PRIVATE_ENDPOINT_REF: private-endpoint://tenant_demo_manufacturing/persisted-operations-postgres-readonly

web:
  replicaCount: 3
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 6
    targetCPUUtilizationPercentage: 65
    targetMemoryUtilizationPercentage: 75
  pdb:
    enabled: true
    minAvailable: 2
  podAnnotations:
    limes-axis.io/profile: local-only

networkPolicy:
  enabled: true
  egressMode: local_only
  localOnly:
    # DNS is scoped to the cluster resolver pods. Operators on node-local DNS
    # use mode: node_local, and explicit in-cluster resolvers use mode: explicit
    # with a declared resolvers list.
    dns:
      mode: cluster
      namespace: kube-system
      podSelector:
        k8s-app: kube-dns
    # The five required names (identity-validation, operational-database,
    # workflow-engine, artifact-object-store, model-inference) plus the optional
    # local graph. A local entry needs a namespace, a podSelector or a bounded
    # ipBlock plus at least one port; an omitted entry needs a reason.
    services:
      - name: identity-validation
        state: local
        components: [api, web]
        podSelector:
          app.kubernetes.io/name: keycloak
        ports:
          - protocol: TCP
            port: 8080
      - name: operational-database
        state: local
        components: [api, worker]
        podSelector:
          app.kubernetes.io/name: postgres
        ports:
          - protocol: TCP
            port: 5432
      - name: workflow-engine
        state: local
        components: [api, worker]
        podSelector:
          app.kubernetes.io/name: temporal
        ports:
          - protocol: TCP
            port: 7233
      - name: artifact-object-store
        state: local
        components: [api, worker]
        podSelector:
          app.kubernetes.io/name: minio
        ports:
          - protocol: TCP
            port: 9000
      - name: distributed-rate-limit
        state: local
        components: [api]
        podSelector:
          app.kubernetes.io/name: valkey
        ports:
          - protocol: TCP
            port: 6379
      - name: model-inference
        state: omitted
        reason: >-
          No compatible local inference runtime is qualified in this public-safe
          baseline; external model egress stays disabled.
      - name: ontology-store
        state: omitted
        reason: >-
          Live TypeDB queries and mutations stay disabled; the limited reference
          graph is not equivalent.
